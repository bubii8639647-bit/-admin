<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2APK Studio - แปลงเว็บไซต์เป็นแอป Android</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151c2c;
            --primary: #3b82f6;
            --success: #10b981;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: var(--card); padding: 28px; border-radius: 18px; border: 1px solid #263147; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { margin: 0 0 6px; font-size: 24px; text-align: center; background: linear-gradient(90deg, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.desc { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #2563eb; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 16px; background: #090d16; border-radius: 12px; border: 1px solid #1e293b; display: none; }
        .status-text { font-size: 14px; color: #38bdf8; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.5s; }
        .dl-btn { display: none; width: 100%; text-align: center; padding: 15px; background: var(--success); color: #022c22; text-decoration: none; font-weight: bold; border-radius: 12px; margin-top: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Web2APK Studio</h1>
    <p class="desc">เปลี่ยนไฟล์เว็บไซต์ของคุณให้เป็นแอป Android (.APK) อัตโนมัติ</p>

    <div class="field">
        <label>ชื่อแอปพลิเคชัน (App Name)</label>
        <input type="text" id="appName" placeholder="เช่น ร้านค้าออนไลน์" value="MyWebApp">
    </div>

    <div class="field">
        <label>รหัสแพ็กเกจ (Package ID)</label>
        <input type="text" id="pkgName" placeholder="com.company.app" value="com.studio.webapp">
    </div>

    <div class="field">
        <label>ไอคอนแอป (ไฟล์ .PNG สี่เหลี่ยมจัตุรัส - ไม่บังคับ)</label>
        <input type="file" id="iconFile" accept="image/png">
    </div>

    <div class="field">
        <label>ไฟล์โค้ดเว็บไซต์ (.ZIP ที่มี index.html อยู่ชั้นนอกสุด)</label>
        <input type="file" id="zipFile" accept=".zip">
    </div>

    <button id="buildBtn" onclick="startProcess()">เริ่มสร้างไฟล์ APK</button>

    <div class="status-box" id="statusBox">
        <div class="status-text" id="statusText">กำลังเตรียมข้อมูล...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <a id="downloadBtn" class="dl-btn" target="_blank">ดาวน์โหลดไฟล์ .APK</a>
</div>

<script>
// ใส่ URL ของ Cloudflare Worker ที่คุณสร้างในโฟลเดอร์ backend
const BACKEND_API_URL = "https://your-worker-name.your-subdomain.workers.dev";

function updateUI(text, percent) {
    document.getElementById("statusBox").style.display = "block";
    document.getElementById("statusText").innerText = text;
    document.getElementById("progressFill").style.width = percent + "%";
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function startProcess() {
    const appName = document.getElementById("appName").value.trim() || "MyWebApp";
    const pkgName = document.getElementById("pkgName").value.trim().toLowerCase() || "com.studio.webapp";
    const zipInput = document.getElementById("zipFile").files[0];
    const iconInput = document.getElementById("iconFile").files[0];
    const btn = document.getElementById("buildBtn");
    const dlBtn = document.getElementById("downloadBtn");

    if (!zipInput) {
        alert("กรุณาเลือกไฟล์ .zip ของเว็บไซต์ก่อนครับ");
        return;
    }

    btn.disabled = true;
    dlBtn.style.display = "none";
    updateUI("กำลังตรวจสอบโครงสร้างไฟล์ .zip...", 15);

    try {
        const zip = await JSZip.loadAsync(zipInput);
        if (!zip.file("index.html")) {
            throw new Error("ไม่พบไฟล์ index.html ที่ชั้นนอกสุดของไฟล์ .zip");
        }

        updateUI("กำลังอัปโหลดไฟล์เข้าสู่ระบบสร้างแอป...", 35);
        const zipBase64 = await fileToBase64(zipInput);
        const iconBase64 = iconInput ? await fileToBase64(iconInput) : null;

        const res = await fetch(`${BACKEND_API_URL}/api/build`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ appName, pkgName, zipBase64, iconBase64 })
        });

        const data = await res.json();
        if (!data.success) throw new Error(data.error || "เกิดข้อผิดพลาดในการส่งข้อมูล");

        updateUI("ระบบกำลังคอมไพล์ไฟล์ APK (ใช้เวลาประมาณ 2-3 นาที)...", 60);

        const poll = setInterval(async () => {
            const statusRes = await fetch(`${BACKEND_API_URL}/api/status?jobId=${data.jobId}`);
            const statusData = await statusRes.json();

            if (statusData.status === "completed") {
                clearInterval(poll);
                btn.disabled = false;
                if (statusData.conclusion === "success") {
                    updateUI("สร้างไฟล์ APK เสร็จสมบูรณ์!", 100);
                    dlBtn.href = statusData.downloadPageUrl;
                    dlBtn.style.display = "block";
                } else {
                    updateUI("การสร้างล้มเหลว กรุณาตรวจสอบโค้ดเว็บของคุณอีกครั้ง", 0);
                }
            } else if (statusData.status === "in_progress") {
                updateUI("กำลังแพ็กไฟล์ Android SDK และเซ็นรับรองแอป...", 80);
            }
        }, 10000);

    } catch (err) {
        alert("ข้อผิดพลาด: " + err.message);
        updateUI("ยกเลิกการทำงาน: " + err.message, 0);
        btn.disabled = false;
    }
}
</script>

</body>
</html>
